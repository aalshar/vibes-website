<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vibes - Discover the best restaurants in Saudi Arabia. Explore, filter, and find your perfect dining experience with AI-powered recommendations.">
  <meta name="keywords" content="restaurants, Saudi Arabia, food, dining, Vibes, restaurant discovery, AI recommendations">
  <meta name="author" content="Vibes">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vibes">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aalsar.github.io/Vibes_Website/">
  <meta property="og:title" content="Vibes - Discover Saudi Arabia's Best Restaurants">
  <meta property="og:description" content="Explore, filter, and find your perfect dining experience with AI-powered recommendations.">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://aalsar.github.io/Vibes_Website/">
  <meta property="twitter:title" content="Vibes - Discover Saudi Arabia's Best Restaurants">
  <meta property="twitter:description" content="Explore, filter, and find your perfect dining experience with AI-powered recommendations.">

  <title>Vibes - Discover Saudi Arabia's Best Restaurants</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "4160746453";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
